name: Unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master
      - develop
  workflow_dispatch:
    

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} 
  cancel-in-progress: true

jobs:
  tests-fullSetup:
    strategy:
      matrix:
        setup: [ {os: ubuntu-latest}, {os: windows-latest}, {os: macos-latest} ] 
    runs-on: ${{matrix.setup.os}}
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
    - uses: actions/checkout@v7
      with:
          persist-credentials: false
        
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
        architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
    - name: Install conan
      run: pip install conan>2 cmake

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install VS Build Tools
      if: runner.os == 'Windows'
      run: |
        choco install visualstudio2022buildtools -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --norestart"

    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v3
      id: cpu-cores

    - name: Run detect
      run: conan profile detect

    - uses: nick-fields/retry@v4
      with:
        timeout_minutes: 60
        max_attempts: 3
        command: python3 Setup.py --build-missing

    - name: Set cmake preset name
      run: python3 .github/GetProfile.py

    - name: cmake
      run: cmake --preset $GeneratedCMakeProfile
      if: runner.os != 'Windows'
    - name: build
      run: cmake --build --preset $GeneratedCMakeProfile -j${{ steps.cpu-cores.outputs.count }}
      if: runner.os != 'Windows'

    - name: cmake
      run: cmake --preset $env:GeneratedCMakeProfile
      if: runner.os == 'Windows'
    - name: build
      run: cmake --build --preset $env:GeneratedCMakeProfile -j${{ steps.cpu-cores.outputs.count }}
      if: runner.os == 'Windows'


    - name: run tests
      run: ctest --preset $GeneratedCMakeProfile -j --output-on-failure 
      if: runner.os != 'Windows'

    
    - name: run tests
      run: ctest --preset $env:GeneratedCMakeProfile -j --output-on-failure 
      if: runner.os == 'Windows'
    
      

  test_check:
    needs: tests-fullSetup
    if: |
      always()
      && github.event_name == 'pull_request'
    env:
      exit_code: ${{ fromJson('[1,0]')[contains(needs.*.result, 'success')] }}
    runs-on: ubuntu-latest
    steps:
      - run: exit $exit_code
